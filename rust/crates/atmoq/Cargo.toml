[package]
name = "atmoq"
description = "atproto firehose over MoQ transport: bridge, server, and consumer CLI"
readme = "../../../README.md"
keywords = ["atproto", "moq", "quic", "firehose", "bluesky"]
categories = ["network-programming", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes = "1"
ciborium.workspace = true
clap.workspace = true
data-encoding = "2"
futures-util.workspace = true
# Fork crates (see vendor/*/UPSTREAM.md and the workspace Cargo.toml): package
# renaming keeps the extern names `moq_native`/`moq_net`, the path builds the
# in-tree copy locally, and the version is what the published crate resolves.
moq-native = { package = "atmoq-moq-native", version = "0.17.0", path = "../../vendor/moq-native" }
moq-native-07.workspace = true
moq-net = { package = "atmoq-moq-net", version = "0.1.12", path = "../../vendor/moq-net" }
moq-transport-07.workspace = true
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
# Heap profiling, behind the non-default `profiling` feature (see [features]).
# Optional so `cargo install atmoq` keeps the system allocator and doesn't
# build jemalloc from source; the production image turns it on.
tikv-jemalloc-ctl = { version = "0.7", features = [
    "profiling",
    "stats",
    "use_std",
], optional = true }
tikv-jemallocator = { version = "0.7", features = [
    "profiling",
    "stats",
], optional = true }
tokio.workspace = true
tokio-rustls = "0.26"
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-logfmt = "0.3.7"
tracing-opentelemetry = "0.33"
tracing-subscriber.workspace = true
url.workspace = true

[features]
default = []
# Swaps in jemalloc as the global allocator with heap profiling compiled in,
# and enables the admin listener's /debug/heap endpoint. Off by default: it
# builds jemalloc from source and changes the allocator for everyone who runs
# `cargo install atmoq`, which is not a decision to make on their behalf. The
# production container image enables it.
#
# Profiling must also be armed at runtime, since jemalloc gates it on an env
# var read at startup:
#   MALLOC_CONF=prof:true,prof_active:true,lg_prof_sample:19
profiling = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
